spring:
  application:
    name: medchart-ehr-api

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  redis:
    host: localhost
    port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.medchart: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

medchart:
  security:
    jwt:
      secret: test-secret-key-for-testing-only
      expiration: 86400000
  audit:
    enabled: false
  integration:
    insurance:
      base-url: http://localhost:8081
      timeout: 5000
    pharmacy:
      base-url: http://localhost:8082
      timeout: 10000