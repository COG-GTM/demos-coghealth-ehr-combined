spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  redis:
    host: localhost
    port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: 0
  servlet:
    context-path: /api

medchart:
  security:
    jwt:
      secret: test-secret-key-that-is-long-enough-for-hs512-algorithm-needs-at-least-64-bytes-so-making-it-really-long
      expiration: 86400000
  audit:
    enabled: false
    async: false
