<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogHealth EHR</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('coghealth_theme');
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            var s = localStorage.getItem('coghealth_settings');
            mode = s ? (JSON.parse(s).appearance || {}).theme : null;
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
