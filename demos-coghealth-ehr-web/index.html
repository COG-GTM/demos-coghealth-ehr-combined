<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogHealth EHR</title>
    <script>
      // Applied before first paint so the workstation never flashes white at night.
      (function () {
        try {
          var stored = localStorage.getItem('coghealth-theme');
          var dark = stored === 'dark' || ((!stored || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* storage blocked: fall back to light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
