<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogHealth EHR</title>
    <script>
      // Applied before first paint so the workstation never flashes white at night.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('coghealth-theme');
        } catch (e) { /* storage blocked: fall back to the OS preference */ }
        // Anything unrecognised normalises to 'system', matching getStoredTheme().
        var dark = stored === 'dark' || (stored !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
